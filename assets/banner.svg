<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="80%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
    }
    @keyframes dashStream {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes beaconPulse {
      0% { r: 4; opacity: 1; }
      100% { r: 16; opacity: 0; }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .stream-line { stroke-dasharray: 8, 8; animation: dashStream 2s linear infinite; }
    .floating-badge-1 { animation: floatCard1 6s ease-in-out infinite; }
    .floating-badge-2 { animation: floatCard2 7s ease-in-out infinite; }
    .beacon { animation: beaconPulse 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <line x1="900" y1="0" x2="900" y2="420"/>
    <line x1="1100" y1="0" x2="1100" y2="420"/>
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="110" r="140" fill="url(#glowGrad1)"/>
  <circle class="orb-2" cx="1020" cy="300" r="160" fill="url(#glowGrad2)"/>

  <!-- Dynamic Animated Pipelines / Data Streams (Background layer) -->
  <g opacity="0.45">
    <!-- Stream 1 (Top Left to Center) -->
    <path class="stream-line" d="M 80 80 Q 240 160 420 120 T 600 130" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <!-- Stream 2 (Bottom Right to Center) -->
    <path class="stream-line" d="M 1120 340 Q 960 260 780 300 T 600 290" fill="none" stroke="#c084fc" stroke-width="2.5"/>
    <!-- Stream 3 (Horizontal connector) -->
    <path class="stream-line" d="M 160 350 C 350 350, 420 370, 600 370 C 780 370, 850 350, 1040 350" fill="none" stroke="#818cf8" stroke-width="1.8"/>
  </g>

  <!-- Interactive/Dynamic Ingestion Pipeline Visual Nodes (Framing the Header) -->
  <!-- Left Side Pipeline Node (Raw Unstructured Input) -->
  <g class="floating-badge-1" transform="translate(60, 130)">
    <rect width="180" height="64" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="28" cy="32" r="12" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">📄</text>
    <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">Raw Documents</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">PDF • Scans • Web</text>
  </g>

  <!-- Left Bottom Floating Node -->
  <g class="floating-badge-2" transform="translate(90, 240)">
    <rect width="160" height="52" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">⚡</text>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">Vision OCR</text>
    <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Layout &amp; Table SOTA</text>
  </g>

  <!-- Right Side Pipeline Node (AI-Ready RAG & Agents) -->
  <g class="floating-badge-2" transform="translate(960, 130)">
    <rect width="180" height="64" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="28" cy="32" r="12" fill="#c084fc" fill-opacity="0.2"/>
    <text x="28" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#c084fc" text-anchor="middle">🧠</text>
    <text x="52" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#f8fafc">LLM &amp; RAG Ready</text>
    <text x="52" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94a3b8">Clean Markdown &amp; JSON</text>
  </g>

  <!-- Right Bottom Floating Node -->
  <g class="floating-badge-1" transform="translate(940, 240)">
    <rect width="170" height="52" rx="10" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.4"/>
    <text x="20" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">🚀</text>
    <text x="44" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#e2e8f0">AI Agent Workflows</text>
    <text x="44" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Semantic Chunking</text>
  </g>

  <!-- CENTRAL FOREGROUND HERO CONTAINER (Guaranteed Foreground Visibility) -->
  <g transform="translate(600, 0)">
    <!-- Pill Badge on Top -->
    <g transform="translate(0, 68)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="-116" cy="0" r="4" fill="#38bdf8"/>
      <circle class="beacon" cx="-116" cy="0" r="4" fill="#38bdf8"/>
      <text x="10" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
        CURATED ECOSYSTEM 2026
      </text>
    </g>

    <!-- Main Title with Distinct Drop Shadow -->
    <text x="0" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="37" letter-spacing="-0.8">
      <tspan fill="#f8fafc">Awesome Unstructured </tspan>
      <tspan fill="url(#primaryGrad)" filter="url(#subtleGlow)">Data Ingestion</tspan>
    </text>

    <!-- Subtitle Title Line 2 -->
    <text x="0" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" letter-spacing="-0.4">
      Engines &amp; Document Parsing
    </text>

    <!-- Clear Explanatory Subtitle -->
    <text x="0" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      The authoritative index of SaaS platforms &amp; open-source engines for PDF parsing,
    </text>
    <text x="0" y="258" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
      vision OCR, layout extraction, and LLM-ready RAG data ingestion pipelines.
    </text>

    <!-- Feature Tag Badges -->
    <g transform="translate(0, 310)">
      <!-- Tag 1 -->
      <g transform="translate(-190, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">⚡ High-Accuracy OCR</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-60, 0)">
        <rect x="-55" y="-14" width="110" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">📊 Table Parsing</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(70, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">🔍 RAG Chunking</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(195, 0)">
        <rect x="-50" y="-14" width="100" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
        <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">🛡️ Zero-Drop Cert</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.3"/>
</svg>
